[workspace]
members = [
  "crates/skillsmgr-core",
  "crates/skillsmgr-parse",
  "crates/skillsmgr-adapters",
  "crates/skillsmgr-scan",
  "crates/skillsmgr-service",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/jangchenchen/M-Skills"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"

