[workspace]
members = [
  "crates/skillsmgr-core",
  "crates/skillsmgr-parse",
  "crates/skillsmgr-fetch",
  "crates/skillsmgr-adapters",
  "crates/skillsmgr-scan",
  "crates/skillsmgr-registry",
  "crates/skillsmgr-translate",
  "crates/skillsmgr-service",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/jangchenchen/M-Skills"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
gix = { version = "0.83", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "sha1", "worktree-mutation"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.39", features = ["bundled", "chrono", "uuid"] }
walkdir = "2"
toml_edit = "0.25"
