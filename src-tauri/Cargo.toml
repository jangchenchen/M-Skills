[package]
name = "m-skills"
version = "0.1.0"
description = "M-Skills desktop manager"
authors = []
license = "MIT"
repository = "https://github.com/jangchenchen/M-Skills"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "m_skills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tauri = { version = "2.8.4", features = ["test"] }
tauri-plugin-log = "2"
skillsmgr-service = { path = "../crates/skillsmgr-service" }
skillsmgr-core = { path = "../crates/skillsmgr-core" }
skillsmgr-fetch = { path = "../crates/skillsmgr-fetch" }
skillsmgr-registry = { path = "../crates/skillsmgr-registry" }
skillsmgr-translate = { path = "../crates/skillsmgr-translate" }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tauri-utils = "2.9.1"
